<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 365" width="100%" role="img" aria-labelledby="fd-title fd-desc"><title id="fd-title">Proposed follow-up: Perception gap video: replication, mechanism and persistence</title><desc id="fd-desc">Perception gap video: replication, mechanism and persistence. 4 conditions: Perception gap video, Video without data, Placebo video, Control. Primary outcome: Affective polarization (in-party minus out-party thermometer) immediately after exposure, full video versus control.. Population: US adult Democrats and Republicans (including leaners) from a Lucid-style online panel.</desc><style>
:root{--fd-ink:#1c1b19;--fd-muted:#8a877f;--fd-rule:#d9d5cc;--fd-accent:#8b1e2d;--fd-bg:#ffffff}
@media (prefers-color-scheme: dark){:root{--fd-ink:#ecebe6;--fd-muted:#b4b1a9;--fd-rule:#4a4a52;--fd-accent:#e08a96;--fd-bg:#1d1d23}}
.box{fill:var(--fd-bg,#fff);stroke:var(--fd-ink,#1c1b19);stroke-width:1.2}
.arm{fill:var(--fd-bg,#fff);stroke:var(--fd-accent,#8b1e2d);stroke-width:1.4}
.soft{fill:var(--fd-bg,#fff);stroke:var(--fd-rule,#d9d5cc);stroke-width:1.2}
text{font-family:Inter,Helvetica,Arial,sans-serif;fill:var(--fd-ink,#1c1b19);font-size:14px}
.cap{font-size:12px;fill:var(--fd-muted,#8a877f)}
.kicker{font-size:11px;letter-spacing:.08em;fill:var(--fd-muted,#8a877f);text-transform:uppercase}
.edge{stroke:var(--fd-ink,#1c1b19);stroke-width:1.2;fill:none;marker-end:url(#fd-arrow)}
.assoc{stroke-dasharray:5 4}
#fd-arrow path{fill:var(--fd-ink,#1c1b19)}
</style>
<defs><marker id="fd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs><text class="kicker" x="20" y="16">Proposed follow-up: Perception gap video: replication, mechanism and persistence</text>
<g>
<rect class="box" x="20" y="157.5" width="200" height="60" rx="6"/>
<text class="kicker" x="32" y="179.5">Population</text>
<text x="32" y="197.5">US adult Democrats and</text>
<text x="32" y="215.5">Republicans (including</text>
<text x="32" y="233.5">leaners) from a Lucid-</text>
<text x="32" y="251.5">style online panel.</text>
</g>
<polygon class="box" points="280,163.5 316,187.5 280,211.5 244,187.5"/>
<path class="edge" d="M220,187.5 L242,187.5"/><text class="cap" x="231.0" y="181.5" text-anchor="middle">randomized</text>
<g id="arm-c_pg" data-text="Full video with misperception data.">
<rect class="arm" x="360" y="30" width="300" height="63" rx="6"/>
<text x="372" y="52">Perception gap video</text>
<text class="cap" x="372" y="70">Full video with misperception data.</text>
</g>
<path class="edge" d="M318,187.5 L356,61.5"/>
<g id="arm-c_nodata" data-text="Same video with the misperception data removed.">
<rect class="arm" x="360" y="105" width="300" height="78" rx="6"/>
<text x="372" y="127">Video without data</text>
<text class="cap" x="372" y="145">Same video with the misperception data</text>
<text class="cap" x="372" y="160">removed.</text>
</g>
<path class="edge" d="M318,187.5 L356,144.0"/>
<g id="arm-c_placebo" data-text="Neutral video of matched length.">
<rect class="arm" x="360" y="195" width="300" height="63" rx="6"/>
<text x="372" y="217">Placebo video</text>
<text class="cap" x="372" y="235">Neutral video of matched length.</text>
</g>
<path class="edge" d="M318,187.5 L356,226.5"/>
<g id="arm-c_ctrl" data-text="Please continue.">
<rect class="arm" x="360" y="270" width="300" height="63" rx="6"/>
<text x="372" y="292">Control</text>
<text class="cap" x="372" y="310">Please continue.</text>
</g>
<path class="edge" d="M318,187.5 L356,301.5"/>
<g>
<rect class="box" x="700" y="127.5" width="240" height="120" rx="6"/>
<text class="kicker" x="712" y="149.5">Primary outcome</text>
<text x="712" y="167.5">Affective polarization (in-</text>
<text x="712" y="185.5">party minus out-party</text>
<text x="712" y="203.5">thermometer) immediately</text>
<text x="712" y="221.5">after exposure, full video</text>
</g>
<path class="edge" d="M660,187.5 L696,187.5"/></svg>