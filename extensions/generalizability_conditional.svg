<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="100%" role="img" aria-labelledby="fd-title fd-desc"><title id="fd-title">Proposed follow-up: Does the Perception gap effect hold across partisanship and baseline polarization?</title><desc id="fd-desc">Does the Perception gap effect hold across partisanship and baseline polarization?. 2 conditions: Perception gap video, Control. Primary outcome: Post-treatment in-party minus out-party thermometer difference (for independents, absolute difference between party thermometers).. Population: US adults from an online panel, including independents and leaners, quota-sampled on party.</desc><style>
